<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eric Carle Art English · Wave · Pick-Up Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --theme-dark: #0B4F6C;
    --theme-mid: #1B7FA6;
    --theme-light: #D6EEF5;
    --theme-pale: #EAF7FB;
    --accent-orange: #F5A623;
    --tag-blue: #E3F2FB;
    --tag-blue-text: #1B7FA6;
    --home-bg: #EAF9F5;
    --home-border: #1C8C6E;
    --ink: #17313E;
    --sub-ink: #5b7a8c;
    --white: #ffffff;
    --radius: 20px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Nunito',sans-serif;background:#EAF6FA;color:var(--ink);}
  .page{max-width:520px;margin:0 auto;background:#EAF6FA;min-height:100vh;}

  header{
    background:linear-gradient(160deg, var(--theme-dark) 0%, var(--theme-mid) 100%);
    text-align:center;padding:24px 16px 26px;position:relative;overflow:hidden;
  }
  header::before{content:"🦀";position:absolute;font-size:64px;opacity:0.15;left:-8px;bottom:-16px;}
  header::after{content:"🎈";position:absolute;font-size:56px;opacity:0.15;right:-6px;top:-14px;}
  .book-title{
    font-family:'DM Sans',sans-serif;font-size:23px;font-weight:900;color:#fff;margin-top:2px;
  }
  .studio-name{font-size:12.5px;color:rgba(255,255,255,0.85);font-weight:700;margin-top:6px;}

  .theme-banner{background:#FFF6E0;text-align:center;padding:12px 16px;font-size:13.5px;color:#8a6100;}
  .theme-banner .q{font-weight:800;}
  .theme-banner .sub{font-weight:800;margin-top:2px;color:#8a6100;}

  .browser-banner{
    background:var(--theme-pale);color:var(--theme-dark);text-align:center;
    font-size:12px;font-weight:700;padding:8px 14px;
  }
  .browser-banner a{color:var(--theme-dark);}

  .tabs{display:flex;flex-wrap:wrap;justify-content:center;background:var(--theme-dark);padding:8px 8px 4px;gap:6px;}
  .tab-btn{
    flex:0 0 auto;border:none;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.75);
    font-weight:800;font-size:12.5px;padding:9px 12px;border-radius:999px;cursor:pointer;margin-bottom:4px;
  }
  .tab-btn.active{color:var(--theme-dark);background:var(--accent-orange);}

  .content{padding:18px 16px 4px;}
  .panel{display:none;}
  .panel.active{display:block;animation:fadeIn .3s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);}}

  .word-card{
    background:var(--white);border-radius:var(--radius);padding:28px 20px 24px;text-align:center;
    box-shadow:0 8px 20px rgba(11,79,108,0.08);
  }
  .page-tag{
    display:inline-block;background:var(--theme-light);color:var(--theme-dark);
    font-weight:800;font-size:11px;padding:4px 12px;border-radius:999px;letter-spacing:0.4px;
  }
  .emoji-illustration{font-size:60px;line-height:1;margin-top:10px;}
  .word-en{
    font-family:'DM Sans',sans-serif;font-size:30px;font-weight:900;color:var(--theme-dark);margin-top:10px;
  }
  .word-kr{font-size:15px;font-weight:800;color:var(--ink);margin-top:4px;}

  .speak-btn{
    margin-top:16px;display:inline-flex;align-items:center;gap:6px;background:var(--theme-mid);color:#fff;
    border:none;font-weight:800;font-size:13.5px;padding:10px 20px;border-radius:999px;cursor:pointer;
    box-shadow:0 6px 14px rgba(27,127,166,0.30);
  }
  .speak-btn:active{transform:scale(0.97);}
  .speak-btn.playing{background:var(--accent-orange);}

  .section-label{
    font-size:12.5px;font-weight:800;color:var(--sub-ink);margin:20px 0 8px 2px;
    display:flex;align-items:center;gap:6px;
  }
  .block{background:var(--white);border-radius:16px;padding:16px 16px 14px;box-shadow:0 6px 14px rgba(11,79,108,0.06);}
  .tag{
    display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:0.4px;
    padding:4px 10px;border-radius:999px;margin-bottom:8px;background:var(--tag-blue);color:var(--tag-blue-text);
  }
  .en-sentence{font-size:16px;font-weight:800;color:var(--ink);line-height:1.4;}
  .en-sentence .hl{color:var(--theme-mid);text-decoration:underline wavy var(--accent-orange);text-underline-offset:3px;}
  .kr-sentence{font-size:13px;color:var(--sub-ink);margin-top:6px;font-weight:700;}

  .home-box{
    margin-top:14px;background:var(--home-bg);border:1.5px solid var(--home-border);border-radius:14px;
    padding:14px 16px;
  }
  .home-box .ttl{font-size:12.5px;font-weight:800;color:var(--home-border);margin-bottom:6px;}
  .home-box .body{font-size:13px;color:#1e5c48;line-height:1.6;}
  .home-box b{color:#0f3d2e;}

  .expr-callout{
    margin-top:18px;background:linear-gradient(135deg, var(--theme-dark), var(--theme-mid));
    color:#fff;border-radius:16px;padding:22px 20px;text-align:center;
  }
  .expr-callout .lbl{font-size:11px;font-weight:800;opacity:0.85;letter-spacing:0.5px;}
  .expr-callout .txt{font-family:'DM Sans',sans-serif;font-size:22px;font-weight:900;margin:10px 0 4px;line-height:1.35;}
  .expr-callout .kr{font-size:12.5px;opacity:0.9;margin-bottom:12px;}
  .expr-callout .speak-btn{background:#fff;color:var(--theme-dark);margin-top:0;}

  footer{
    background:var(--theme-dark);text-align:center;padding:16px;margin-top:22px;
    font-size:11px;color:rgba(255,255,255,0.75);line-height:1.7;
  }
</style>
</head>
<body>
<div class="page">

<header>
  <div class="book-title">Wave: Preposition Adventure</div>
  <div class="studio-name">에릭칼아트잉글리쉬 동탄기산 스튜디오</div>
</header>

<div class="theme-banner">
  <div class="q">🦀 이번 시간 테마 · What are you waiting for?</div>
  <div class="sub">갯벌 속 새로운 세상으로 풍덩 뛰어들어요!</div>
</div>

<div class="browser-banner">
  🔊 소리가 안 나오면 <a href="#" onclick="alert('우측 상단 ⋮ 메뉴 → \'다른 브라우저로 열기\' 또는 \'Chrome으로 열기\'를 선택해주세요.'); return false;">크롬(Chrome)</a>으로 열어주세요
</div>

<div class="tabs" id="tabs"></div>
<div class="content" id="content"></div>

<footer>
  © 2026 에릭칼아트잉글리쉬 동탄기산 스튜디오<br>
  본 자료는 수강생 전용 · 무단 복제 및 배포 금지
</footer>

</div>

<script>
const words = [
  {
    page: "PAGE 2", en: "Nearby", kr: "~근처에",
    emoji: "🎈",
    sentence: "A child with a balloon is just <span class='hl'>nearby</span> the mudflats.",
    sentenceKr: "풍선을 든 아이가 갯벌 근처에 서 있어요.",
    tpr: "친구들과 훌라후프(갯벌) 옆에 나란히 서서 <b>\"Nearby!\"</b>를 외쳐보세요."
  },
  {
    page: "PAGE 3", en: "Over", kr: "~위로",
    emoji: "🎈",
    sentence: "The balloon flies away <span class='hl'>over</span> the mudflats.",
    sentenceKr: "풍선이 갯벌 위로 날아가요.",
    tpr: "훌라후프를 훌쩍 뛰어넘으며 <b>\"Over!\"</b>를 외쳐보세요."
  },
  {
    page: "PAGE 4", en: "Into", kr: "~안으로",
    emoji: "👣",
    sentence: "She finally steps <span class='hl'>into</span> the mudflats.",
    sentenceKr: "소녀가 드디어 갯벌 안으로 들어가요.",
    tpr: "훌라후프 안으로 폴짝 뛰어 들어가며 <b>\"Into!\"</b>를 외쳐보세요."
  },
  {
    page: "PAGE 4", en: "In the middle of", kr: "~한가운데에",
    emoji: "🧍",
    sentence: "The child stands <span class='hl'>in the middle of</span> the mudflats.",
    sentenceKr: "아이가 갯벌 한가운데 서 있어요.",
    tpr: "훌라후프 한가운데 서서 팔을 벌리고 <b>\"In the middle!\"</b>를 외쳐보세요."
  },
  {
    page: "PAGE 5", en: "Under", kr: "~아래에",
    emoji: "🫨",
    sentence: "Things are wiggling <span class='hl'>under</span> the mudflats.",
    sentenceKr: "무언가 갯벌 아래에서 꿈틀거려요.",
    tpr: "몸을 낮춰 바닥에 엎드리며 꿈틀꿈틀, <b>\"Under!\"</b>를 외쳐보세요."
  },
  {
    page: "PAGE 6", en: "Out of", kr: "~밖으로",
    emoji: "🦀",
    sentence: "All the things are crawling <span class='hl'>out of</span> the mudflats.",
    sentenceKr: "모든 것들이 갯벌 밖으로 기어나와요.",
    tpr: "훌라후프 밖으로 기어나오며 <b>\"Out of!\"</b>를 외쳐보세요."
  },
];

const tabsEl = document.getElementById('tabs');
const contentEl = document.getElementById('content');

words.forEach((w, i) => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
  btn.textContent = w.en;
  btn.onclick = () => showPanel(i);
  tabsEl.appendChild(btn);

  if(i === 2){
    const brk = document.createElement('div');
    brk.style.flexBasis = '100%';
    brk.style.height = '0';
    tabsEl.appendChild(brk);
  }

  const panel = document.createElement('div');
  panel.className = 'panel' + (i === 0 ? ' active' : '');
  panel.innerHTML = `
    <div class="word-card">
      <span class="page-tag">📖 ${w.page}</span>
      <div class="emoji-illustration">${w.emoji}</div>
      <div class="word-en">${w.en}</div>
      <div class="word-kr">${w.kr}</div>
      <button class="speak-btn" onclick="speakText('${w.en}', this)">🔊 들어보기</button>
    </div>

    <div class="section-label">📖 책 속 이 문장</div>
    <div class="block">
      <span class="tag">FROM THE BOOK</span>
      <div class="en-sentence">${w.sentence}</div>
      <div class="kr-sentence">${w.sentenceKr}</div>
      <button class="speak-btn" onclick="speakText('${stripTags(w.sentence)}', this)" style="margin-top:12px;">🔊 문장 듣기</button>
    </div>

    <div class="home-box">
      <div class="ttl">🤸 몸으로 표현해요!</div>
      <div class="body">${w.tpr}</div>
    </div>
  `;
  contentEl.appendChild(panel);
});

// Key expression (shown once, persists across tabs)
const extra = document.createElement('div');
extra.innerHTML = `
  <div class="expr-callout">
    <div class="lbl">KEY EXPRESSION</div>
    <div class="txt">"What are you waiting for?"</div>
    <div class="kr">뭘 망설여? 용기를 내봐!</div>
    <button class="speak-btn" onclick="speakText('What are you waiting for?', this)">🔊 들어보기</button>
  </div>
`;
contentEl.appendChild(extra);

function stripTags(str){ return str.replace(/<[^>]*>/g, ''); }

function showPanel(idx){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active', i===idx));
  document.querySelectorAll('.panel').forEach((p,i)=>p.classList.toggle('active', i===idx));
}

let audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked) return;
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buffer = ctx.createBuffer(1,1,22050);
    const src = ctx.createBufferSource();
    src.buffer = buffer; src.connect(ctx.destination); src.start(0);
    audioUnlocked = true;
  }catch(e){}
}
document.addEventListener('touchstart', unlockAudio, {once:true});
document.addEventListener('click', unlockAudio, {once:true});

function pickVoice(){
  const voices = window.speechSynthesis.getVoices();
  const priority = ['Samantha','Google US English','Microsoft Aria','Microsoft Jenny'];
  for(const name of priority){
    const v = voices.find(v => v.name.includes(name));
    if(v) return v;
  }
  return voices.find(v => v.lang === 'en-US') || voices[0];
}

function speakText(text, btnEl){
  if(!('speechSynthesis' in window)){
    alert('이 브라우저는 음성 재생을 지원하지 않아요. Chrome 브라우저를 이용해주세요.');
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  const v = pickVoice();
  if(v) utter.voice = v;
  btnEl.classList.add('playing');
  utter.onend = () => btnEl.classList.remove('playing');
  utter.onerror = () => btnEl.classList.remove('playing');
  window.speechSynthesis.speak(utter);
}

if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged = () => {}; }
</script>
</body>
</html>
